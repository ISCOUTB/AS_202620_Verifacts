name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest

  docker-smoke:
    name: Build y smoke test de la imagen
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t verifacts:ci .

      - name: Arrancar el contenedor
        run: docker run -d --name verifacts -p 8000:8000 verifacts:ci

      - name: Esperar a que /health responda
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs verifacts
          exit 1

      - name: Comprobar que /metrics es consultable
        run: curl -fsS http://localhost:8000/metrics | grep verifacts_http_requests_total

      - name: Mostrar logs estructurados del contenedor
        if: always()
        run: docker logs verifacts