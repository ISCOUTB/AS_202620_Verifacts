name: Keep-alive Render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: GET /health
    runs-on: ubuntu-latest
    steps:
      - name: Despertar/mantener despierto el servicio
        run: |
          curl --fail --silent --show-error \
            --max-time 180 \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            https://verifacts-api.onrender.com/health
