name: Keep-alive Render (manual)

# El schedule (cada 5 minutos) se retiró el 2026-10-20: el despliegue de referencia
# es el servidor del laboratorio (ADR-0010) y las ejecuciones programadas ocultaban los
# runs de Tests y SonarCloud en el listado de Actions. Se conserva el disparo manual.
on:
  workflow_dispatch:

jobs:
  ping:
    name: GET /health
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servicio de Render
        run: |
          curl --fail --silent --show-error \
            --max-time 180 \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            https://verifacts-api.onrender.com/health
