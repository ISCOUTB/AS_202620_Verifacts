name: Keep-alive Render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: GET /health
    runs-on: ubuntu-latest
    steps:
      - name: Despertar/mantener despierto el servicio
        run: |
          curl --fail --silent --show-error \
               --max-time 90 --retry 2 --retry-delay 5 \
               https://verifacts-api.onrender.com/health
